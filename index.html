<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fram eller bak?</title>
<meta name="description" content="Sök vart du ska i Stockholm och se var du ska sitta på tunnelbanan och pendeltåget för att kliva av närmast rätt uppgång.">
<meta name="theme-color" content="#eef2f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d131c" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Familjen+Grotesk:wght@500;600;700&display=swap">
<style>
:root {
  --bg: #eef2f6;
  --surface: #ffffff;
  --surface-2: #f5f7fa;
  --ink: #0f1a2a;
  --ink-2: #2b3a4f;
  --muted: #5d6b7e;
  --line: #d9e0e8;
  --line-2: #c7d0db;
  --accent: #f4b400;
  --accent-soft: #fff3cc;
  --accent-ink: #1d1600;
  --focus: #1f6feb;
  --train: #33445b;
  --train-win: #aebdd0;
  --platform: #cfd7e1;
  --edge: #f4b400;
  --shadow: 0 1px 2px rgba(15, 26, 42, .06), 0 4px 16px rgba(15, 26, 42, .06);
  --green: #1f8f4a;
  --red: #d42a31;
  --blue: #0f6fb8;
  --pendel: #d0417f;
  --roslag: #7f4fa3;
  --saltsjo: #148a98;
  --tvar: #d9700f;
  --lidingo: #9a5a22;
  --nockeby: #5f7087;
  --good: #1f8f4a;
  --radius: 14px;
  --font-display: "Familjen Grotesk", "Helvetica Neue", Arial, system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0d131c;
    --surface: #151e2b;
    --surface-2: #1b2635;
    --ink: #e8eef6;
    --ink-2: #c9d3e0;
    --muted: #97a4b6;
    --line: #253245;
    --line-2: #33435a;
    --accent: #f6c33b;
    --accent-soft: #3a3014;
    --accent-ink: #1a1400;
    --focus: #6aa7ff;
    --train: #8497b0;
    --train-win: #2a3a50;
    --platform: #2c3a4e;
    --edge: #f6c33b;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
    --green: #3fb36b;
    --red: #f0565c;
    --blue: #4a9de0;
    --pendel: #eb6aa3;
    --roslag: #a67cc8;
    --saltsjo: #3cb2bf;
    --tvar: #f0913a;
    --lidingo: #c98a4f;
    --nockeby: #8ea0b8;
    --good: #3fb36b;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0d131c;
  --surface: #151e2b;
  --surface-2: #1b2635;
  --ink: #e8eef6;
  --ink-2: #c9d3e0;
  --muted: #97a4b6;
  --line: #253245;
  --line-2: #33435a;
  --accent: #f6c33b;
  --accent-soft: #3a3014;
  --accent-ink: #1a1400;
  --focus: #6aa7ff;
  --train: #8497b0;
  --train-win: #2a3a50;
  --platform: #2c3a4e;
  --edge: #f6c33b;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
  --green: #3fb36b;
  --red: #f0565c;
  --blue: #4a9de0;
  --pendel: #eb6aa3;
  --roslag: #a67cc8;
  --saltsjo: #3cb2bf;
  --tvar: #f0913a;
  --lidingo: #c98a4f;
  --nockeby: #8ea0b8;
  --good: #3fb36b;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
a { color: inherit; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 8px; }

.wrap { max-width: 640px; margin: 0 auto; padding-inline: 16px; }

/* ---------- masthead */
.masthead { padding-block: 18px 6px; }
.masthead { position: relative; }
.lang {
  position: absolute; top: 10px; right: 0; z-index: 1;
  display: grid; grid-template-columns: 1fr 1fr;
  padding: 3px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--line-2);
  box-shadow: var(--shadow);
}
.lang button {
  position: relative; z-index: 1;
  min-width: 44px; min-height: 34px; padding: 0 12px;
  border: 0; border-radius: 999px; background: transparent;
  font-family: var(--font-display); font-weight: 700; font-size: 14px; letter-spacing: .05em;
  color: var(--muted); transition: color .2s ease;
}
.lang button[aria-checked="true"] { color: var(--accent-ink); }
.lang-thumb {
  position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px);
  border-radius: 999px; background: var(--accent);
  transition: transform .22s cubic-bezier(.3,.7,.3,1);
}
.lang[data-lang="en"] .lang-thumb { transform: translateX(100%); }
@media (prefers-reduced-motion: reduce) { .lang-thumb, .lang button { transition: none; } }
.brand { display: flex; align-items: center; gap: 10px; }
.brand svg { flex: none; width: 46px; height: 20px; }
.brand h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(28px, 7.4vw, 36px);
  letter-spacing: -0.02em;
  line-height: 1.05;
}
.tagline { margin: 6px 0 0; color: var(--muted); font-size: 15px; max-width: 34em; text-wrap: pretty; }

/* ---------- search */
.searchbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: var(--bg);
  padding-block: 10px 10px;
}
.searchbar::after {
  content: "";
  position: absolute; left: 0; right: 0; bottom: -10px; height: 10px;
  background: linear-gradient(var(--bg), transparent);
  pointer-events: none;
}
.field {
  position: relative;
  display: flex;
  align-items: center;
  background: var(--surface);
  border: 2px solid var(--line-2);
  border-radius: 14px;
  box-shadow: var(--shadow);
  transition: border-color .15s ease;
}
.field:focus-within { border-color: var(--ink); }
.field .glass { flex: none; width: 22px; height: 22px; margin-left: 14px; color: var(--muted); }
#q {
  flex: 1;
  min-width: 0;
  height: 56px;
  border: 0;
  outline: none;
  background: transparent;
  padding: 0 8px 0 10px;
  font-size: 18px;
  font-family: var(--font-body);
}
#q::placeholder { color: var(--muted); opacity: 1; }
#q::-webkit-search-cancel-button { display: none; }
.clear {
  flex: none;
  width: 48px; height: 48px;
  margin-right: 4px;
  border: 0; border-radius: 12px;
  background: transparent;
  color: var(--muted);
  display: grid; place-items: center;
}
.clear:active { background: var(--surface-2); }
.clear svg { width: 20px; height: 20px; }

.suggest {
  list-style: none;
  margin: 8px 0 0;
  padding: 6px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow);
  max-height: var(--sug-max, min(60vh, 520px));
  overflow-y: auto;
  overscroll-behavior: contain;
}
.opt {
  display: flex; align-items: center; gap: 12px;
  min-height: 56px;
  padding: 8px 10px;
  border-radius: 10px;
  cursor: pointer;
}
.opt[aria-selected="true"], .opt:active { background: var(--surface-2); }
.opt-main { min-width: 0; display: flex; flex-direction: column; }
.opt-name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.opt-name mark { background: none; color: inherit; text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 3px; text-underline-offset: 3px; }
.opt-sub { color: var(--muted); font-size: 14px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.3; }
.opt-empty { padding: 14px 12px; color: var(--muted); }
.ico {
  flex: none;
  width: 34px; height: 34px;
  border-radius: 10px;
  display: grid; place-items: center;
  background: var(--surface-2);
  color: var(--ink-2);
}
.ico svg { width: 19px; height: 19px; }
.mode {
  flex: none;
  width: 34px; height: 34px;
  border-radius: 50%;
  display: grid; place-items: center;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 17px;
  color: #fff;
  background: var(--ink-2);
}

/* ---------- chips: one swipeable row per kind */
.chips { display: grid; gap: 8px; padding-block: 2px 4px; }
.chiprow { display: flex; align-items: center; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; scroll-padding-inline: 16px; }
.chiprow::-webkit-scrollbar { display: none; }
.chips-label { flex: none; font-size: 12.5px; color: var(--muted); letter-spacing: .05em; text-transform: uppercase; }
.chip {
  flex: none;
  white-space: nowrap;
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 40px;
  padding: 8px 14px;
  border: 1px solid var(--line-2);
  border-radius: 999px;
  background: var(--surface);
  font-size: 15px;
}
.chip:active { background: var(--surface-2); }

/* ---------- results */
main { padding-block: 10px 24px; }
.dest { padding: 6px 2px 12px; }
.kicker { font-size: 13px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.dest h2 {
  margin: 2px 0 0;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 26px;
  line-height: 1.12;
  letter-spacing: -0.015em;
  text-wrap: balance;
}
.dest .dest-sub { color: var(--muted); margin-top: 2px; }
.example-note {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 13px;
  background: var(--accent-soft);
  color: var(--ink);
  border-radius: 999px;
  padding: 3px 10px;
  margin-bottom: 8px;
}
.cards { display: flex; flex-direction: column; gap: 14px; }
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.card-head { display: flex; align-items: center; gap: 12px; padding: 14px 14px 10px; }
.card-title { min-width: 0; flex: 1; }
.card-title h3 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 21px;
  line-height: 1.15;
  letter-spacing: -0.01em;
}
.card-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; color: var(--muted); font-size: 14px; margin-top: 3px; }
.walk { flex: none; text-align: right; font-variant-numeric: tabular-nums; }
.walk strong { display: block; font-size: 17px; }
.walk span { font-size: 13px; color: var(--muted); }
.badge {
  display: inline-grid; place-items: center;
  min-width: 26px; height: 22px;
  padding: 0 6px;
  border-radius: 6px;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 13px;
  color: #fff;
  font-variant-numeric: tabular-nums;
}
.group { border-top: 1px solid var(--line); padding: 12px 14px 14px; }
.group:first-of-type { border-top: 0; padding-top: 0; }
.group-title { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); margin-bottom: 8px; }

.exitpick { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 10px; margin: 0 -2px; scrollbar-width: none; }
.exitpick::-webkit-scrollbar { display: none; }
.xchip {
  flex: none;
  display: inline-flex; align-items: center; gap: 8px;
  min-height: 44px;
  padding: 6px 14px;
  border-radius: 12px;
  border: 1px solid var(--line-2);
  background: var(--surface);
  text-align: left;
  max-width: 78vw;
}
.xchip[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.xchip .letter {
  flex: none;
  width: 28px; height: 28px; border-radius: 8px;
  display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 700; font-size: 15px;
  background: var(--surface-2); color: var(--ink);
  border: 1px solid var(--line-2);
}
.xchip[aria-checked="true"] .letter { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.xchip .xname { font-weight: 700; font-size: 15px; line-height: 1.15; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.xchip .xdist { display: block; font-size: 12.5px; color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }

.bestexit { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 6px; }
.bestexit .pill { font-size: 14px; padding: 4px 10px; }
.linkbtn { border: 0; background: none; padding: 8px 4px; min-height: 36px; color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; font-size: 14px; }
.platform { margin: 2px 0 4px; }
.platform svg { display: block; width: 100%; height: auto; }
.ends { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--muted); margin-top: -2px; }
.ends span:last-child { text-align: right; }

.dirs { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.dir {
  background: var(--surface-2);
  border-radius: 12px;
  padding: 10px 12px 8px;
}
.dir-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.dir-text { min-width: 0; }
.dir-from { font-size: 15px; }
.dir-from b { font-weight: 700; }
.dir-to { font-size: 13.5px; color: var(--muted); margin-top: 1px; }
.dir-lines { display: inline-flex; flex-wrap: wrap; gap: 3px; vertical-align: 1px; margin-left: 4px; }
.dir-lines .badge { min-width: 22px; height: 18px; font-size: 11.5px; border-radius: 5px; padding: 0 4px; }
.answer { flex: none; text-align: right; line-height: 1.05; }
.answer .verb { display: block; font-size: 12.5px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.answer .ans {
  display: block;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 22px;
  letter-spacing: -0.01em;
  white-space: nowrap;
}
.train { display: block; width: 100%; height: auto; margin-top: 6px; }
.meta-row { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 14px; color: var(--muted); }
.meta-row a { color: var(--ink-2); text-underline-offset: 3px; }
.pill {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 13px;
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--surface-2);
  color: var(--ink-2);
}
.warn { color: var(--ink-2); background: var(--accent-soft); border-radius: 10px; padding: 8px 10px; font-size: 14px; margin-top: 10px; }
.empty { background: var(--surface); border: 1px dashed var(--line-2); border-radius: var(--radius); padding: 18px; color: var(--muted); }
.more-btn {
  width: 100%;
  min-height: 48px;
  border: 1px dashed var(--line-2);
  border-radius: 12px;
  background: transparent;
  color: var(--ink-2);
  font-weight: 700;
}

/* ---------- how it works + footer */
.how { margin-top: 26px; display: grid; gap: 10px; }
.how h2 { font-family: var(--font-display); font-size: 19px; margin: 0; letter-spacing: -0.01em; }
.how p { margin: 0; color: var(--ink-2); font-size: 15px; max-width: 38em; }
footer { color: var(--muted); font-size: 13px; padding-block: 18px 34px; border-top: 1px solid var(--line); margin-top: 22px; }
footer p { margin: 0 0 6px; max-width: 40em; }
.loading { color: var(--muted); font-size: 14px; }

/* start page: just the title and the search field, centred */
body.home .masthead { padding-top: max(24px, calc(34vh - 90px)); }
body.home .brand { justify-content: center; }
body.home .chiprow { justify-content: center; }
body.home footer { display: none; }
@media (min-width: 700px) {
  .masthead { padding-block: 34px 8px; }
  .dest h2 { font-size: 30px; }
}
@media (prefers-reduced-motion: no-preference) {
  .card { animation: rise .3s ease; }
  @keyframes rise { from { transform: translateY(8px); } to { transform: none; } }
  .xchip, .chip, .opt { transition: background-color .12s ease, border-color .12s ease; }
}
</style>

<body>
<div class="wrap">
  <header class="masthead">
    <div class="lang" role="radiogroup" aria-label="Språk / Language">
      <span class="lang-thumb" aria-hidden="true"></span>
      <button type="button" role="radio" data-lang="sv" aria-checked="true" aria-label="Svenska">SV</button>
      <button type="button" role="radio" data-lang="en" aria-checked="false" aria-label="English">EN</button>
    </div>
    <div class="brand">
      <svg viewBox="0 0 46 20" aria-hidden="true">
        <rect x="1" y="3" width="13" height="13" rx="3" fill="var(--train)"/>
        <rect x="16" y="3" width="13" height="13" rx="3" fill="var(--train)"/>
        <path d="M31 3h8.5c3 0 5.5 3 5.5 6.5S42.5 16 39.5 16H31z" fill="var(--accent)"/>
        <rect x="3" y="6" width="9" height="4" rx="1" fill="var(--train-win)"/>
        <rect x="18" y="6" width="9" height="4" rx="1" fill="var(--train-win)"/>
        <rect x="33" y="6" width="7" height="4" rx="1" fill="var(--accent-ink)" opacity=".35"/>
        <rect x="0" y="18" width="46" height="2" rx="1" fill="var(--edge)"/>
      </svg>
      <h1 id="appTitle">Fram eller bak?</h1>
    </div>
  </header>
</div>

<div class="searchbar">
  <div class="wrap">
    <form id="searchForm" role="search" autocomplete="off">
      <label class="sr-only" for="q">Vart ska du?</label>
      <div class="field">
        <svg class="glass" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
        <input id="q" type="search" name="q" inputmode="search" enterkeyhint="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
               placeholder="Vart ska du? T.ex. Södersjukhuset" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggest">
        <button type="button" id="clearBtn" class="clear" aria-label="Rensa sökningen" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <ul id="suggest" class="suggest" role="listbox" aria-label="Sökförslag" hidden></ul>
    </form>
  </div>
</div>

<div class="wrap">
  <div id="chips" class="chips"></div>
  <main id="result" aria-live="polite"></main>


  <footer>
    <p id="footText">Kartdata © OpenStreetMap-bidragsgivare (ODbL). Inte kopplad till SL. Uppgångar kan ändras – kolla skyltarna på plats.</p>
  </footer>

    STATIONS.forEach(function (st) {
      var d = hav(lat, lon, st.ll[0], st.ll[1]) - (st.s === "metro" || st.s === "pendel" ? 60 : 0);
      if (d < bd) { bd = d; best = st.n; }
    });
    return best;
  }

  function search(q) {
    var fq = fold(q);
    if (!fq) return [];
    var qt = fq.split(" ");
    var res = [];
    // addresses: "gatan 12"
    var numIdx = -1;
    qt.forEach(function (t, i) { if (/^\d+[a-z]?$/.test(t) && i > 0) numIdx = i; });
    if (numIdx > 0 && ADDR_KEYS) {
      var num = qt[numIdx].toUpperCase();
      var st = qt.slice(0, numIdx), rest = qt.slice(numIdx + 1);
      var stf = st.join(" ");
      ADDR_KEYS.forEach(function (a) {
        if (a.f.indexOf(stf) !== 0) return;
        if (rest.length && !rest.every(function (t) { return a.ct.some(function (c) { return c.indexOf(t) === 0; }); })) return;
        var list = decodeAddr(a.k);
        var hit = null;
        for (var i = 0; i < list.length; i++) if (list[i].n === num) { hit = list[i]; break; }
        if (!hit) for (var j = 0; j < list.length; j++) if (parseInt(list[j].n, 10) === parseInt(num, 10)) { hit = list[j]; break; }
        if (!hit) return;
        var area = nearestArea(hit.lat, hit.lon);
        res.push({ e: { k: "a", name: a.street + " " + hit.n, cat: "Adress", addr: a.city, area: area, lat: hit.lat, lon: hit.lon }, s: 200 - (a.f === stf ? 0 : 10) });
      });
    }
    for (var i = 0; i < IDX.length; i++) {
      var e = IDX[i];
      var m = matchTokens(qt, e);
      if (m < 0) continue;
      var s = e.w;
      if (e.f === fq) s += 120;
      else if (e.f.indexOf(fq) === 0) s += 70;
      else if (e.af && e.af.some(function (a) { return a === fq; })) s += 105;
      else if (e.af && e.af.some(function (a) { return a.indexOf(fq) === 0; })) s += 60;
      else if (m === qt.length) s += 30;
      s += m * 6;
      s -= Math.min(30, e.f.length * 0.2);
      if (e.k === "st") s -= 90; // the user is looking for a destination: places first, then stations
      res.push({ e: e, s: s });
    }
    res.sort(function (a, b) { return b.s - a.s; });
    var out = [], seen = {};
    for (var r = 0; r < res.length && out.length < 8; r++) {
      var x = res[r].e;
      var key = x.k === "st" ? "st" + x.st.id : fold(x.name) + "|" + (x.cat || "") + "|" + (x.lat ? Math.round(x.lat * 200) + "," + Math.round(x.lon * 100) : "");
      if (seen[key]) continue;
      seen[key] = 1;
      out.push(x);
    }
    return out;
  }

  // ------------------------------------------------------------ search UI
  var qEl = $("#q"), sugEl = $("#suggest"), clearBtn = $("#clearBtn"), chipsEl = $("#chips");
  var opts = [], active = -1;

  var ICON = {
    p: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.1-7-11.5A7 7 0 0 1 19 9.5C19 14.9 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
    s: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3 5 21M16 3l3 18M12 4v3M12 11v3M12 18v2"/></svg>',
    a: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11 12 4l8 7v9H4z"/><path d="M10 20v-5h4v5"/></svg>'
  };
  function hl(name, q) {
    var fq = fold(q).split(" ")[0];
    if (!fq) return esc(name);
    var f = fold(name);
    var idx = f.indexOf(fq);
    if (idx < 0 || f.length !== name.length) return esc(name);
    return esc(name.slice(0, idx)) + "<mark>" + esc(name.slice(idx, idx + fq.length)) + "</mark>" + esc(name.slice(idx + fq.length));
  }
  function subOf(e) {
    if (e.k === "st") return sysName(e.st.s) + " · " + e.st.lines.join(" ");
    var parts = [catName(e.cat)];
    if (e.addr) parts.push(e.addr);
    if (e.area) parts.push(t("near") + " " + e.area);
    return parts.join(" · ");
  }
  function optHTML(e, i, q) {
    var icon = e.k === "st" ? '<span class="mode" style="background:' + stationColor(e.st) + '">' + SYS[e.st.s].letter + "</span>" : '<span class="ico">' + (ICON[e.k] || ICON.p) + "</span>";
    return '<li class="opt" role="option" id="opt-' + i + '" aria-selected="' + (i === active) + '" data-i="' + i + '">' + icon +
      '<span class="opt-main"><span class="opt-name">' + hl(e.name, q) + '</span><span class="opt-sub">' + esc(subOf(e)) + "</span></span></li>";
  }
  function showSug(show) {
    sugEl.hidden = !show;
    qEl.setAttribute("aria-expanded", show ? "true" : "false");
    if (show) fitSuggest();
  }
  // keep the suggestion list above the on-screen keyboard
  function fitSuggest() {
    var vv = window.visualViewport;
    var h = vv ? vv.height : window.innerHeight;
    var top = sugEl.getBoundingClientRect().top;
    var avail = Math.max(180, Math.min(520, h - top - 12));
    document.documentElement.style.setProperty("--sug-max", avail + "px");
  }
  if (window.visualViewport) window.visualViewport.addEventListener("resize", function () { if (!sugEl.hidden) fitSuggest(); });
  function update() {
    var q = qEl.value;
    clearBtn.hidden = !q;
    if (!q.trim()) { opts = []; showSug(false); renderChips(); return; }
    loadPlaces();
    opts = search(q);
    active = opts.length ? 0 : -1;
    var html = opts.map(function (e, i) { return optHTML(e, i, q); }).join("");
    if (!opts.length) {
      html = '<li class="opt-empty">' + (placesState === "loading" ? t("loading") : t("notFound")) + "</li>";
    } else if (placesState === "loading") {
      html += '<li class="opt-empty loading">' + t("loadingMore") + "</li>";
    }
    sugEl.innerHTML = html;
    qEl.setAttribute("aria-activedescendant", active >= 0 ? "opt-" + active : "");
    showSug(true);
  }
  function setActive(i) {
    if (!opts.length) return;
    active = (i + opts.length) % opts.length;
    Array.prototype.forEach.call(sugEl.querySelectorAll(".opt"), function (li, j) { li.setAttribute("aria-selected", j === active ? "true" : "false"); });
    qEl.setAttribute("aria-activedescendant", "opt-" + active);
    var li = sugEl.querySelector("#opt-" + active);
    if (li) li.scrollIntoView({ block: "nearest" });
  }

  function choose(e, opts2) {
    opts2 = opts2 || {};
    selState = {}; openState = {};
    if (e.k === "st") {
      current = { type: "station", st: e.st };
      setHash("s-" + e.st.id);
    } else {
      current = { type: "place", place: { name: e.name, sub: e.addr || "", cat: e.cat, lat: e.lat, lon: e.lon } };
      setHash("q-" + slug(e.name + (e.k !== "a" && e.area ? " " + e.area : "")));
    }
    if (!opts2.keepInput) qEl.value = e.name;
    clearBtn.hidden = !qEl.value;
    showSug(false);
    if (!opts2.silent) {
      qEl.blur();
      pushRecent(e);
    }
    render();
    renderChips();
    if (!opts2.silent) {
      var top = result.getBoundingClientRect().top + window.scrollY - 90;
      window.scrollTo({ top: Math.max(0, top), behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
    }
  }

  var routedHash = null;
  function setHash(h) {
    routedHash = h;
    try { history.replaceState(null, "", "#" + h); } catch (e) { /* ignore */ }
  }

  qEl.addEventListener("input", update);
  qEl.addEventListener("focus", function () { loadPlaces(); if (qEl.value.trim()) update(); });
  qEl.addEventListener("keydown", function (ev) {
    if (ev.key === "ArrowDown") { ev.preventDefault(); setActive(active + 1); }
    else if (ev.key === "ArrowUp") { ev.preventDefault(); setActive(active - 1); }
    else if (ev.key === "Enter") { ev.preventDefault(); if (opts[active]) choose(opts[active]); }
    else if (ev.key === "Escape") { showSug(false); }
  });
  $("#searchForm").addEventListener("submit", function (ev) { ev.preventDefault(); if (opts[active]) choose(opts[active]); });
  sugEl.addEventListener("mousedown", function (ev) { ev.preventDefault(); });
  sugEl.addEventListener("click", function (ev) {
    var li = ev.target.closest(".opt");
    if (li) choose(opts[+li.getAttribute("data-i")]);
  });
  clearBtn.addEventListener("click", function () { qEl.value = ""; update(); qEl.focus(); });
  document.addEventListener("click", function (ev) { if (!ev.target.closest("#searchForm")) showSug(false); });

  // ------------------------------------------------------------ chips: recent + examples
  var EXAMPLES = ["Södersjukhuset", "Globen", "Lidl Solna centrum", "Karolinska sjukhuset", "Mall of Scandinavia", "Stockholms universitet", "Odenplan"];
  function pushRecent(e) {
    var r = store("feb.recent") || [];
    var item = e.k === "st" ? { k: "st", id: e.st.id, name: e.st.n } : { k: e.k, name: e.name, addr: e.addr, area: e.area, cat: e.cat, lat: e.lat, lon: e.lon };
    r = r.filter(function (x) { return x.name !== item.name; });
    r.unshift(item);
    store("feb.recent", r.slice(0, 6));
  }
  function renderChips() {
    var r = store("feb.recent") || [];
    var html = "";
    if (r.length) {
      html += '<div class="chiprow" role="group" aria-label="' + t("recentAria") + '"><span class="chips-label">' + t("recent") + "</span>";
      r.forEach(function (x, i) { html += '<button type="button" class="chip" data-recent="' + i + '">' + esc(x.name) + "</button>"; });
      html += "</div>";
    }
    chipsEl.innerHTML = html;
    chipsEl.hidden = !!qEl.value.trim() && !current;
  }
  chipsEl.addEventListener("click", function (ev) {
    var b = ev.target.closest(".chip");
    if (!b) return;
    if (b.hasAttribute("data-recent")) {
      var x = (store("feb.recent") || [])[+b.getAttribute("data-recent")];
      if (!x) return;
      if (x.k === "st" && STATIONS_BY_ID[x.id]) choose({ k: "st", st: STATIONS_BY_ID[x.id], name: x.name });
      else choose(x);
      return;
    }
    var q = b.getAttribute("data-ex");
    runQuery(q);
  });
  function runQuery(q) {
    qEl.value = q;
    if (placesState !== "ready") {
      loadPlaces();
      pendingQuery = q;
      update();
      return;
    }
    var r = search(q);
    if (r.length) choose(r[0]);
    else update();
  }
  var pendingQuery = null;

  // ------------------------------------------------------------ routing
  function routeFromHash(fromLoad) {
    var h = (location.hash || "").replace(/^#/, "");
    if (pendingQuery && placesState === "ready") { var pq = pendingQuery; pendingQuery = null; runQuery(pq); return true; }
    if (!h) return false;
    if (h === routedHash) return true;
    if (h.indexOf("s-") === 0 && STATIONS_BY_ID[h.slice(2)]) {
      var st = STATIONS_BY_ID[h.slice(2)];
      choose({ k: "st", st: st, name: st.n }, { silent: true });
      return true;
    }
    if (h.indexOf("q-") === 0) {
      if (placesState !== "ready") { loadPlaces(); return false; }
      if (!fromLoad && current) return true;
      var r = search(h.slice(2).replace(/-/g, " "));
      if (r.length) { choose(r[0], { silent: true }); return true; }
    }
    return false;
  }

  window.addEventListener("hashchange", function () { routeFromHash(true); });
  document.querySelector(".lang").addEventListener("click", function (ev) {
    var b = ev.target.closest("button[data-lang]");
    if (!b || b.getAttribute("data-lang") === LANG) return;
    LANG = b.getAttribute("data-lang");
    store0("feb.lang", LANG);
    applyStatic();
    if (current) { var keepSel = selState, keepOpen = openState; render(); selState = keepSel; openState = keepOpen; }
    renderChips();
    if (!sugEl.hidden) update();
  });

  // ------------------------------------------------------------ start
  document.body.classList.add("home");
  renderChips();
  if (!routeFromHash(false)) {
    /* start with just the search field */
  }
  // warm up the place index after first paint
  if ("requestIdleCallback" in window) requestIdleCallback(loadPlaces, { timeout: 2500 }); else setTimeout(loadPlaces, 800);
})();
</script>
