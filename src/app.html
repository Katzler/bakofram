        var isl = islandOf(pl.lat, pl.lon);
        if (far) html += '<p class="warn">' + t("far") + " (" + t("approx") + " " + fmtDist(walkM(near.pick[0].d)) + ")." + (isl && isl.tip ? " " + t(isl.tip) : "") + "</p>";
        else if (isl && isl.tip) html += '<p class="warn">' + t(isl.tip) + "</p>";
        html += '<div class="cards">' + near.pick.map(function (r) { return cardHTML(r.st, pl, r.d); }).join("") + "</div>";
      }
    }
    result.innerHTML = html;
    document.body.classList.toggle("home", !current);
    revealSelected(result);
  }
  function revealSelected(root) {
    Array.prototype.forEach.call(root.querySelectorAll(".exitpick"), function (row) {
      var on = row.querySelector('.xchip[aria-checked="true"]');
      if (!on) return;
      var left = on.offsetLeft - row.offsetLeft - 16;
      if (left + on.offsetWidth > row.clientWidth || left < 0) row.scrollLeft = Math.max(0, left - (row.clientWidth - on.offsetWidth) / 2);
    });
  }

  result.addEventListener("click", function (ev) {
    var more = ev.target.closest(".more-exits");
    if (more) {
      var g0 = more.closest(".group");
      openState[g0.getAttribute("data-key")] = true;
      rerenderGroup(g0);
      var first = result.querySelector('.group[data-key="' + g0.getAttribute("data-key") + '"] .xchip[aria-checked="true"]');
      if (first) first.focus({ preventScroll: true });
      return;
    }
    var b = ev.target.closest(".xchip");
    if (!b) return;
    var grp = b.closest(".group");
    selState[grp.getAttribute("data-key")] = +b.getAttribute("data-i");
    var card = b.closest(".card");
    var st = STATIONS_BY_ID[card.getAttribute("data-st")];
    var dest = current && current.type === "place" ? current.place : null;
    var gi = +grp.getAttribute("data-key").split(":").pop();
    var tmp = document.createElement("div");
    tmp.innerHTML = groupHTML(st, gi, dest);
    var fresh = tmp.firstChild;
    var oldRow = grp.querySelector(".exitpick"), keep = oldRow ? oldRow.scrollLeft : 0;
    grp.replaceWith(fresh);
    var newRow = fresh.querySelector(".exitpick");
    if (newRow) newRow.scrollLeft = keep;
    var nb = fresh.querySelector('.xchip[data-i="' + b.getAttribute("data-i") + '"]');
    if (nb) nb.focus({ preventScroll: true });
  });

  var STATIONS_BY_ID = {};
  STATIONS.forEach(function (st) { STATIONS_BY_ID[st.id] = st; });

  // ------------------------------------------------------------ search index
  var IDX = [];
  function toks(s) { return fold(s).split(" ").filter(Boolean); }
  STATIONS.forEach(function (st) {
    var extra = (st.al || []).join(" ");
    IDX.push({ k: "st", name: st.n, f: fold(st.n), af: (st.al || []).map(fold), nt: toks(st.n + " " + extra), xt: toks(SYS[st.s].name + " " + SYS_EN[st.s] + " station"), w: st.s === "metro" || st.s === "pendel" ? 118 : 108, st: st });
  });
  var PL = null, ADDR = null, ADDR_KEYS = null, placesState = "idle";
  function loadPlaces() {
    if (placesState !== "idle") return;
    placesState = "loading";
    fetch(PLACES_URL).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).then(function (d) {
      PL = d;
      var cats = d.cats, areas = d.areas;
      var L0 = d.lat0, O0 = d.lon0;
      d.p.forEach(function (p) {
        var area = p[4] >= 0 ? areas[p[4]] : "";
        IDX.push({ k: "p", name: p[0], cat: cats[p[1]], area: area, f: fold(p[0]), af: p[6] ? p[6].split(";").map(fold) : null, nt: toks(p[0] + " " + (p[6] || "")), xt: toks(cats[p[1]] + " " + (CAT_EN[cats[p[1]]] || "") + " " + area + " " + (p[5] || "")), w: p[7], lat: L0 + p[2] / 1e5, lon: O0 + p[3] / 1e5, addr: p[5] });
      });
      d.s.forEach(function (s) {
        var area = s[1] >= 0 ? areas[s[1]] : "";
        IDX.push({ k: "s", name: s[0], cat: "Gata", area: area, f: fold(s[0]), nt: toks(s[0]), xt: toks(area), w: 44, lat: L0 + s[2] / 1e5, lon: O0 + s[3] / 1e5 });
      });
      ADDR = d.a; ADDR_KEYS = Object.keys(d.a).map(function (k) { var parts = k.split("|"); return { k: k, street: parts[0], city: parts[1], f: fold(parts[0]), ct: toks(parts[1] || "") }; });
      placesState = "ready";
      if (qEl.value.trim() && document.activeElement === qEl) update();
      routeFromHash(true);
    }).catch(function () { placesState = "failed"; if (qEl.value.trim() && document.activeElement === qEl) update(); });
  }

  function decodeAddr(key) {
    var s = ADDR[key], out = [], la = 0, lo = 0;
    s.split(";").forEach(function (part, i) {
      var a = part.split(",");
      if (i === 0) { la = +a[1]; lo = +a[2]; } else { la += +a[1]; lo += +a[2]; }
      out.push({ n: a[0], lat: PL.lat0 + la / 1e5, lon: PL.lon0 + lo / 1e5 });
    });
    return out;
  }

  function matchTokens(qt, e) {
    var inName = 0;
    for (var i = 0; i < qt.length; i++) {
      var t = qt[i], hit = false;
      for (var j = 0; j < e.nt.length; j++) if (e.nt[j].indexOf(t) === 0) { hit = true; inName++; break; }
      if (!hit) for (var k = 0; k < e.xt.length; k++) if (e.xt[k].indexOf(t) === 0) { hit = true; break; }
      if (!hit) return -1;
    }
    return inName;
  }

  function nearestArea(lat, lon) {
    var best = null, bd = Infinity;
    STATIONS.forEach(function (st) {
      var d = hav(lat, lon, st.ll[0], st.ll[1]) - (st.s === "metro" || st.s === "pendel" ? 60 : 0);
      if (d < bd) { bd = d; best = st.n; }
    });
    return best;
  }

  function search(q) {
    var fq = fold(q);
    if (!fq) return [];
    var qt = fq.split(" ");
    var res = [];
    // addresses: "gatan 12"
    var numIdx = -1;
    qt.forEach(function (t, i) { if (/^\d+[a-z]?$/.test(t) && i > 0) numIdx = i; });
    if (numIdx > 0 && ADDR_KEYS) {
      var num = qt[numIdx].toUpperCase();
      var st = qt.slice(0, numIdx), rest = qt.slice(numIdx + 1);
      var stf = st.join(" ");
      ADDR_KEYS.forEach(function (a) {
        if (a.f.indexOf(stf) !== 0) return;
        if (rest.length && !rest.every(function (t) { return a.ct.some(function (c) { return c.indexOf(t) === 0; }); })) return;
        var list = decodeAddr(a.k);
        var hit = null;
        for (var i = 0; i < list.length; i++) if (list[i].n === num) { hit = list[i]; break; }
        if (!hit) for (var j = 0; j < list.length; j++) if (parseInt(list[j].n, 10) === parseInt(num, 10)) { hit = list[j]; break; }
        if (!hit) return;
        var area = nearestArea(hit.lat, hit.lon);
        res.push({ e: { k: "a", name: a.street + " " + hit.n, cat: "Adress", addr: a.city, area: area, lat: hit.lat, lon: hit.lon }, s: 200 - (a.f === stf ? 0 : 10) });
      });
    }
    for (var i = 0; i < IDX.length; i++) {
      var e = IDX[i];
      var m = matchTokens(qt, e);
      if (m < 0) continue;
      var s = e.w;
      if (e.f === fq) s += 120;
      else if (e.f.indexOf(fq) === 0) s += 70;
      else if (e.af && e.af.some(function (a) { return a === fq; })) s += 105;
      else if (e.af && e.af.some(function (a) { return a.indexOf(fq) === 0; })) s += 60;
      else if (m === qt.length) s += 30;
      s += m * 6;
      s -= Math.min(30, e.f.length * 0.2);
      if (e.k === "st") s -= 90; // the user is looking for a destination: places first, then stations
      res.push({ e: e, s: s });
    }
    res.sort(function (a, b) { return b.s - a.s; });
    var out = [], seen = {};
    for (var r = 0; r < res.length && out.length < 8; r++) {
      var x = res[r].e;
      var key = x.k === "st" ? "st" + x.st.id : fold(x.name) + "|" + (x.cat || "") + "|" + (x.lat ? Math.round(x.lat * 200) + "," + Math.round(x.lon * 100) : "");
      if (seen[key]) continue;
      seen[key] = 1;
      out.push(x);
    }
    return out;
  }

  // ------------------------------------------------------------ search UI
  var qEl = $("#q"), sugEl = $("#suggest"), clearBtn = $("#clearBtn"), chipsEl = $("#chips");
  var opts = [], active = -1;

  var ICON = {
    p: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.1-7-11.5A7 7 0 0 1 19 9.5C19 14.9 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
    s: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3 5 21M16 3l3 18M12 4v3M12 11v3M12 18v2"/></svg>',
    a: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11 12 4l8 7v9H4z"/><path d="M10 20v-5h4v5"/></svg>'
  };
  function hl(name, q) {
    var fq = fold(q).split(" ")[0];
    if (!fq) return esc(name);
    var f = fold(name);
    var idx = f.indexOf(fq);
    if (idx < 0 || f.length !== name.length) return esc(name);
    return esc(name.slice(0, idx)) + "<mark>" + esc(name.slice(idx, idx + fq.length)) + "</mark>" + esc(name.slice(idx + fq.length));
  }
  function subOf(e) {
    if (e.k === "st") return sysName(e.st.s) + " · " + e.st.lines.join(" ");
    var parts = [catName(e.cat)];
    if (e.addr) parts.push(e.addr);
    if (e.area) parts.push(t("near") + " " + e.area);
    return parts.join(" · ");
  }
  function optHTML(e, i, q) {
    var icon = e.k === "st" ? '<span class="mode" style="background:' + stationColor(e.st) + '">' + SYS[e.st.s].letter + "</span>" : '<span class="ico">' + (ICON[e.k] || ICON.p) + "</span>";
    return '<li class="opt" role="option" id="opt-' + i + '" aria-selected="' + (i === active) + '" data-i="' + i + '">' + icon +
      '<span class="opt-main"><span class="opt-name">' + hl(e.name, q) + '</span><span class="opt-sub">' + esc(subOf(e)) + "</span></span></li>";
  }
  function showSug(show) {
    sugEl.hidden = !show;
    qEl.setAttribute("aria-expanded", show ? "true" : "false");
    if (show) fitSuggest();
  }
  // keep the suggestion list above the on-screen keyboard
  function fitSuggest() {
    var vv = window.visualViewport;
    var h = vv ? vv.height : window.innerHeight;
    var top = sugEl.getBoundingClientRect().top;
    var avail = Math.max(180, Math.min(520, h - top - 12));
    document.documentElement.style.setProperty("--sug-max", avail + "px");
  }
  if (window.visualViewport) window.visualViewport.addEventListener("resize", function () { if (!sugEl.hidden) fitSuggest(); });
  function update() {
    var q = qEl.value;
    clearBtn.hidden = !q;
    if (!q.trim()) { opts = []; showSug(false); renderChips(); return; }
    loadPlaces();
    opts = search(q);
    active = opts.length ? 0 : -1;
    var html = opts.map(function (e, i) { return optHTML(e, i, q); }).join("");
    if (!opts.length) {
      html = '<li class="opt-empty">' + (placesState === "loading" ? t("loading") : t("notFound")) + "</li>";
    } else if (placesState === "loading") {
      html += '<li class="opt-empty loading">' + t("loadingMore") + "</li>";
    }
    sugEl.innerHTML = html;
    qEl.setAttribute("aria-activedescendant", active >= 0 ? "opt-" + active : "");
    showSug(true);
  }
  function setActive(i) {
    if (!opts.length) return;
    active = (i + opts.length) % opts.length;
    Array.prototype.forEach.call(sugEl.querySelectorAll(".opt"), function (li, j) { li.setAttribute("aria-selected", j === active ? "true" : "false"); });
    qEl.setAttribute("aria-activedescendant", "opt-" + active);
    var li = sugEl.querySelector("#opt-" + active);
    if (li) li.scrollIntoView({ block: "nearest" });
  }

  function choose(e, opts2) {
    opts2 = opts2 || {};
    selState = {}; openState = {};
    if (e.k === "st") {
      current = { type: "station", st: e.st };
      setHash("s-" + e.st.id);
    } else {
      current = { type: "place", place: { name: e.name, sub: e.addr || "", cat: e.cat, lat: e.lat, lon: e.lon } };
      setHash("q-" + slug(e.name + (e.k !== "a" && e.area ? " " + e.area : "")));
    }
    if (!opts2.keepInput) qEl.value = e.name;
    clearBtn.hidden = !qEl.value;
    showSug(false);
    if (!opts2.silent) {
      qEl.blur();
      pushRecent(e);
    }
    render();
    renderChips();
    if (!opts2.silent) {
      var top = result.getBoundingClientRect().top + window.scrollY - 90;
      window.scrollTo({ top: Math.max(0, top), behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
    }
  }

  var routedHash = null;
  function setHash(h) {
    routedHash = h;
    try { history.replaceState(null, "", "#" + h); } catch (e) { /* ignore */ }
  }

  qEl.addEventListener("input", update);
  qEl.addEventListener("focus", function () { loadPlaces(); if (qEl.value.trim()) update(); });
  qEl.addEventListener("keydown", function (ev) {
    if (ev.key === "ArrowDown") { ev.preventDefault(); setActive(active + 1); }
    else if (ev.key === "ArrowUp") { ev.preventDefault(); setActive(active - 1); }
    else if (ev.key === "Enter") { ev.preventDefault(); if (opts[active]) choose(opts[active]); }
    else if (ev.key === "Escape") { showSug(false); }
  });
  $("#searchForm").addEventListener("submit", function (ev) { ev.preventDefault(); if (opts[active]) choose(opts[active]); });
  sugEl.addEventListener("mousedown", function (ev) { ev.preventDefault(); });
  sugEl.addEventListener("click", function (ev) {
    var li = ev.target.closest(".opt");
    if (li) choose(opts[+li.getAttribute("data-i")]);
  });
  clearBtn.addEventListener("click", function () { qEl.value = ""; update(); qEl.focus(); });
  document.addEventListener("click", function (ev) { if (!ev.target.closest("#searchForm")) showSug(false); });

  // ------------------------------------------------------------ chips: recent + examples
  var EXAMPLES = ["Södersjukhuset", "Globen", "Lidl Solna centrum", "Karolinska sjukhuset", "Mall of Scandinavia", "Stockholms universitet", "Odenplan"];
  function pushRecent(e) {
    var r = store("feb.recent") || [];
    var item = e.k === "st" ? { k: "st", id: e.st.id, name: e.st.n } : { k: e.k, name: e.name, addr: e.addr, area: e.area, cat: e.cat, lat: e.lat, lon: e.lon };
    r = r.filter(function (x) { return x.name !== item.name; });
    r.unshift(item);
    store("feb.recent", r.slice(0, 6));
  }
  function renderChips() {
    var r = store("feb.recent") || [];
    var html = "";
    if (r.length) {
      html += '<div class="chiprow" role="group" aria-label="' + t("recentAria") + '"><span class="chips-label">' + t("recent") + "</span>";
      r.forEach(function (x, i) { html += '<button type="button" class="chip" data-recent="' + i + '">' + esc(x.name) + "</button>"; });
      html += "</div>";
    }
    chipsEl.innerHTML = html;
    chipsEl.hidden = !!qEl.value.trim() && !current;
  }
  chipsEl.addEventListener("click", function (ev) {
    var b = ev.target.closest(".chip");
    if (!b) return;
    if (b.hasAttribute("data-recent")) {
      var x = (store("feb.recent") || [])[+b.getAttribute("data-recent")];
      if (!x) return;
      if (x.k === "st" && STATIONS_BY_ID[x.id]) choose({ k: "st", st: STATIONS_BY_ID[x.id], name: x.name });
      else choose(x);
      return;
    }
    var q = b.getAttribute("data-ex");
    runQuery(q);
  });
  function runQuery(q) {
    qEl.value = q;
    if (placesState !== "ready") {
      loadPlaces();
      pendingQuery = q;
      update();
      return;
    }
    var r = search(q);
    if (r.length) choose(r[0]);
    else update();
  }
  var pendingQuery = null;

  // ------------------------------------------------------------ routing
  function routeFromHash(fromLoad) {
    var h = (location.hash || "").replace(/^#/, "");
    if (pendingQuery && placesState === "ready") { var pq = pendingQuery; pendingQuery = null; runQuery(pq); return true; }
    if (!h) return false;
    if (h === routedHash) return true;
    if (h.indexOf("s-") === 0 && STATIONS_BY_ID[h.slice(2)]) {
      var st = STATIONS_BY_ID[h.slice(2)];
      choose({ k: "st", st: st, name: st.n }, { silent: true });
      return true;
    }
    if (h.indexOf("q-") === 0) {
      if (placesState !== "ready") { loadPlaces(); return false; }
      if (!fromLoad && current) return true;
      var r = search(h.slice(2).replace(/-/g, " "));
      if (r.length) { choose(r[0], { silent: true }); return true; }
    }
    return false;
  }

  window.addEventListener("hashchange", function () { routeFromHash(true); });
  document.querySelector(".lang").addEventListener("click", function (ev) {
    var b = ev.target.closest("button[data-lang]");
    if (!b || b.getAttribute("data-lang") === LANG) return;
    LANG = b.getAttribute("data-lang");
    store0("feb.lang", LANG);
    applyStatic();
    if (current) { var keepSel = selState, keepOpen = openState; render(); selState = keepSel; openState = keepOpen; }
    renderChips();
    if (!sugEl.hidden) update();
  });

  // ------------------------------------------------------------ start
  document.body.classList.add("home");
  renderChips();
  if (!routeFromHash(false)) {
    /* start with just the search field */
  }
  // warm up the place index after first paint
  if ("requestIdleCallback" in window) requestIdleCallback(loadPlaces, { timeout: 2500 }); else setTimeout(loadPlaces, 800);
})();
</script>
